# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---
# Auris Android release pipeline: builds the signed `fm.auris` AAB and uploads
# it to Google Play's internal testing track. Runs on agents tagged
# `queue=auris-android`, on main, after the GitHub test workflows pass: the
# GitHub-side trigger job invokes this pipeline via the Buildkite API, which
# must be the ONLY entry — the "build on push" webhook is off for this
# pipeline in Buildkite's settings, so nothing bypasses the GitHub gate.
#
# All step commands live in `.buildkite/commands/` (Buildkite interpolates
# `$` in pipeline YAML at upload time, which would break the shell scripts).
#
# While the Play service-account key does not exist, the pipeline stops at
# the release AAB artifact; signing switches on once the keystore secrets
# exist. Both are environment-gated in the scripts.

agents:
  queue: "auris-android"

steps:
  - label: "Release AAB"
    key: release-aab
    branches: "main"
    command: .buildkite/commands/auris-release-aab.sh
    timeout_in_minutes: 70
    artifact_paths:
      - "app/build/outputs/bundle/release/*.aab"

  - label: "Upload to Play internal track"
    key: play-upload
    branches: "main"
    depends_on: [release-aab]
    command: .buildkite/commands/auris-play-upload.sh
    timeout_in_minutes: 30
