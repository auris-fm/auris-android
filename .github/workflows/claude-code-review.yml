# Posts a Claude code review at a deliberate review point, not on every push.
#
# This workflow is shared between the Android, iOS, and Web Player repos.
# If you edit it here, please apply the same change to the other two.
#
# Triggers, and why only these:
#   - ready_for_review: the author has finished their own review and is offering the change.
#   - /review issue comment: an explicit request for the CURRENT head, after fixes.
# Removed deliberately:
#   - synchronize: one review per push paid repeatedly for a question whose answer only
#     changes when the PR does. A lane that pushed per commit produced 69 reviews for one
#     reviewable change, and every one was a distinct head, so deduplication alone would
#     have saved nothing.
#   - opened: an opened PR is not yet offered; a lane that opens non-draft requests review
#     with /review once its own reviews pass, so draft-first is a convenience rather than a
#     requirement.
#   - reopened: reopening is not a review request, and the head is unchanged.
#
# A successful review is recorded as a commit status named "Claude review" ON THE REVIEWED
# HEAD. A later commit therefore carries no such status, so a stale verdict cannot be
# inherited and a merge check can see freshness rather than assume it.
#
# THE INVARIANT THIS FILE MAINTAINS, and the scope it holds in:
#   every COMPLETED review ends in exactly one of — a `Claude review` status, or a comment
#   naming why not (stale head / action failed / model failed / skipped).
#
# A run that did not finish is OUTSIDE it and must stay there. A cancelled, timed-out,
# aborted or never-started job cannot be reported by any step, because the steps do not
# run — and it does not need to be, because the Actions UI says the job did not succeed,
# which is true. Do NOT add a step to cover it: its conditions would be satisfied only
# where a step that already reports has run, so it could never fire, and an unreachable
# safety net reads as coverage in the one file where there is none.

name: Claude Code Review

on:
  pull_request:
    types: [ready_for_review]
  issue_comment:
    types: [created]

# Cancel an in-progress review when a newer commit lands on the same PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  resolve-target:
    # Resolves ONE target — the PR, its current head, and whether this event should review at
    # all — so the review job never has to reason about which event fired. Both entry points
    # (a PR event and a /review comment) converge here.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      should-review: ${{ steps.resolve.outputs.should-review }}
      pr-number: ${{ steps.resolve.outputs.pr-number }}
      head-sha: ${{ steps.resolve.outputs.head-sha }}
      skip-reason: ${{ steps.resolve.outputs.skip-reason }}
    steps:
      - name: Resolve the PR, its head, and whether to review
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          # A PR event carries the payload directly; a comment carries the issue number instead.
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_DRAFT: ${{ github.event.pull_request.draft }}
          EVENT_ACTION: ${{ github.event.action }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          skip() { echo "should-review=false" >> "$GITHUB_OUTPUT"; echo "skip-reason=$1" >> "$GITHUB_OUTPUT"; echo "Not reviewing: $1"; }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            PR="$EVENT_PR_NUMBER"
            # Draft PRs are not reviewed: the review is a deliberate act at the moment the
            # author offers the change, and a draft is by definition still being worked on.
            if [ "$EVENT_DRAFT" = "true" ]; then skip "draft PR"; exit 0; fi
          else
            PR="$EVENT_ISSUE_NUMBER"
            # Exact `/review`, nothing else — no prefix matching, no prose that contains it.
            if [ "$(printf '%s' "$COMMENT_BODY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')" != "/review" ]; then
              skip "comment is not an exact /review"; exit 0
            fi
            if [ "$COMMENT_AUTHOR" = "dependabot[bot]" ]; then skip "comment author is dependabot"; exit 0; fi
          fi

          # A comment can land on an issue; only a PR can be reviewed.
          PR_JSON=$(gh api "repos/${REPOSITORY}/pulls/${PR}" 2>/dev/null || echo "")
          if [ -z "$PR_JSON" ]; then skip "target #${PR} is not a pull request"; exit 0; fi

          DRAFT=$(printf '%s' "$PR_JSON" | jq -r '.draft')
          CROSS_REPO=$(printf '%s' "$PR_JSON" | jq -r '.head.repo.full_name != "'"$REPOSITORY"'"')
          HEAD_SHA=$(printf '%s' "$PR_JSON" | jq -r '.head.sha')
          if [ "$DRAFT" = "true" ]; then skip "PR #${PR} is a draft"; exit 0; fi
          if [ "$CROSS_REPO" = "true" ]; then skip "PR #${PR} is from a fork"; exit 0; fi

          # Permission gate for the comment path: the author must hold write/maintain/admin
          # NOW. A comment is a request, not an authorization, so it is checked rather than
          # trusted.
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            PERM=$(gh api "repos/${REPOSITORY}/collaborators/${COMMENT_AUTHOR}/permission" --jq '.permission' 2>/dev/null || echo "none")
            case "$PERM" in
              admin|maintain|write) ;;
              *) skip "comment author ${COMMENT_AUTHOR} has ${PERM}, needs write/maintain/admin"; exit 0 ;;
            esac
          fi

          # Same-head success is not repeated: the verdict is a statement about a commit, so
          # re-running it on the same commit cannot change the answer and would only spend.
          EXISTING=$(gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=Claude%20review" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null || echo 0)
          STATUS_STATE=$(gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}/status" --jq '.statuses[] | select(.context == "Claude review") | .state' 2>/dev/null | head -1 || echo "")
          if [ "${EXISTING:-0}" -gt 0 ] || [ "${STATUS_STATE:-}" = "success" ]; then
            skip "head ${HEAD_SHA} already has a successful Claude review"
            # Re-affirm the status so a manual /review on an already-reviewed head is still
            # visible as answered rather than silently dropped.
            exit 0
          fi

          echo "pr-number=${PR}" >> "$GITHUB_OUTPUT"
          echo "head-sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "should-review=true" >> "$GITHUB_OUTPUT"
          echo "Reviewing PR #${PR} at head ${HEAD_SHA}"

  claude-review:
    needs: resolve-target
    # The resolve job already applied every guard (draft, fork, dependabot, permission,
    # exact command, same-head success), so this job has one condition rather than five.
    if: needs.resolve-target.outputs.should-review == 'true'
    runs-on: ubuntu-latest
    # Bounds a review that hangs, so a stuck run cannot hold a runner for the default budget. The
    # review is a single model call; this is generous enough not to cut a slow one short.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      # Required to record the reviewed head as a commit status below. GitHub sets any
      # permission ABSENT from this list to `none`, so without this line the status write is
      # rejected — which fails the job (a red check on the default branch), not silently.
      statuses: write
      # Unused while github_token is passed below (App OIDC exchange skipped).
      id-token: write
    steps:
      # Named for what it decides, not what it runs. A skipped review reports here as a
      # SUCCESSFUL step that did nothing, because GitHub has no third state; the status
      # below is what carries "a review actually completed", and it is only written when
      # the review step succeeded.
      - name: Check workflow changes (may skip the review)
        id: workflow-changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve-target.outputs.pr-number }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_PATH: .github/workflows/claude-code-review.yml
        run: |
          set -euo pipefail
          # Use the files API — `gh pr diff --name-only` 406s on diffs >20k lines.
          if gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --paginate --jq '.[].filename' | grep -Fx "$WORKFLOW_PATH"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping Claude review because this PR changes ${WORKFLOW_PATH}; Claude app token validation requires the workflow to match the default branch."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Note that this PR's review is skipped
        # Says on the PR why no review will run, so the absence is attributable rather than
        # silent. GitHub has no third state for a job, so a skipped review otherwise reads as
        # a passing check on the changed file. No status is recorded, so the head is not
        # marked reviewed either.
        if: steps.workflow-changes.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve-target.outputs.pr-number }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body 'Automated review skipped: this PR modifies `.github/workflows/claude-code-review.yml`, and the Claude App token check requires the workflow to match the default branch. No `Claude review` status is recorded, so this head is not marked reviewed.'

      - name: Assert the status permission is declared
        # The read-back check adopted as the fifth requirement: every job that writes a commit
        # status must declare statuses: write, because GitHub sets absent permissions to none and
        # the rejected write fails the job. The defect is CROSS-ARTIFACT — neither the step nor
        # the permissions block shows it alone, only their relationship does — so this asserts
        # the relationship. Scope: an INLINE `.../statuses/...` call, which is this repo's shape;
        # the script refuses (rather than passes) a shape it cannot read.
        run: ruby .github/scripts/check-status-permission.rb .github/workflows/claude-code-review.yml

      - name: Checkout the reviewed head
        if: steps.workflow-changes.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The RESOLVED head, not the event's default ref: a comment-triggered run has no
          # PR ref, and pinning makes the reviewed commit explicit rather than implied.
          ref: ${{ needs.resolve-target.outputs.head-sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require the review model to be configured
        # FAILS BEFORE ANY MODEL ACCESS. A fallback here would run the review under a model nobody
        # chose and, worse, SPEND on it: the setting exists to govern that spend, so discovering it was
        # absent after the tokens are gone is the wrong order. An undefined secret evaluates to the
        # empty string rather than erroring, so the absence has to be turned into a failure here.
        #
        # The value is not printed — existence is the requirement, not content.
        id: resolve-model
        if: steps.workflow-changes.outputs.skip != 'true'
        env:
          CONFIGURED_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: |
          set -euo pipefail
          if [ -z "${CONFIGURED_MODEL:-}" ]; then
            echo "::error::ANTHROPIC_MODEL is not set (or resolves to empty). Refusing to run the review: it would select a model silently and spend on it. Set the repository secret and re-request the review."
            exit 1
          fi
          # Named, not valued: the model is one of the two levers on review cost, so a run must be
          # attributable to the model that produced it.
          echo "Review model: ${CONFIGURED_MODEL}"
          echo "model=${CONFIGURED_MODEL}" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        if: steps.workflow-changes.outputs.skip != 'true'
        id: claude-review
        uses: anthropics/claude-code-action@c81e3bc69d1b18badbb63ba39581218f02421678 # v1.0.201
        env:
          # Anthropic-compatible gateway (Auris). Sourced from secrets for uniformity.
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Skip Claude GitHub App install; use Actions token for GitHub API.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ needs.resolve-target.outputs.pr-number }}
            REVIEWED HEAD: ${{ needs.resolve-target.outputs.head-sha }}

            Read AGENTS.md first - it carries this repo's conventions.

            Priorities, in order:
            1. Correctness - bugs reachable from real user flows: wrong logic,
               unhandled states, races and threading violations, object lifetime
               and retain issues, leaks.
            2. Unintended behaviour change - anything the diff changes that the
               description does not claim to change.
            3. Security and privacy - untrusted input reaching queries, parsers or
               the filesystem; secrets or user data in logs.
            4. Performance - only where the impact is user-visible.

            Comments:
            - Open a blocking correctness or behaviour-change finding with its
              user-facing impact in one plain sentence: what breaks, for which
              user, and when, and then the code mechanism, the problem and the
              fix.
            - Keep comments short by default - a few sentences stating the problem
              and the fix, not the reasoning that led you there. Spend more words
              only where the finding needs them to be actionable: a subtle race, a
              non-obvious call path, a concrete repro.
            - Start a comment with "(nit)" for a trivial suggestion, and
              "(non-blocking)" for something worth knowing that should not hold up
              the merge. An unprefixed comment means it blocks.
            - At most three "(nit)"/"(non-blocking)" comments between them. Blocking
              findings are uncapped.
            - Raise a pre-existing issue only if this PR makes it reachable, more
              likely, or harder to fix later - and say which.
            - Never comment to confirm code is correct, restate the diff, or praise it.
            - Never describe a command you did not run or a file you did not read.

            Do not comment on what other CI already checks: formatting and lint, PR
            hygiene (labels, milestone, description, CHANGELOG presence), or whether
            tests pass.

            Output:
            - Inline comments for anything anchored to a line.
            - One summary comment:
              - Two to four sentences of verdict. No preamble, no restating the PR.
              - Then the findings grouped under `### Blocking`, `### Non-blocking`,
                `### Nits`. Skip a group that is empty; skip the section entirely if
                there are no findings, leaving the verdict as the whole summary.
              - One line per finding: `path/to/file:123` followed by a single
                sentence that leads with the user-facing impact, then the fix -
                enough to act on without opening the thread. Add the inline
                comment's URL when you have one.
              - A finding with no line to anchor to takes the same shape with just
                the path, or no path when it is repo-wide.
            - No tables, no re-analysis, no checklist of what you read, no praise.

            If new commits arrived since your last review on this PR:
            - Review only what changed since then.
            - Re-raise an earlier finding only if it is still open - one line, linking
              the existing thread rather than restating it.
            - If nothing new and nothing open, say so in one sentence and stop.

          claude_args: |
            --model ${{ steps.resolve-model.outputs.model }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Report a review that did not complete
        # The third state GitHub cannot express: the action ran, the step succeeded, but the MODEL
        # did not complete a review. Recording nothing is right, and saying nothing would leave the
        # absence indistinguishable from a skip, so this states it on the PR.
        if: >-
          steps.workflow-changes.outputs.skip != 'true' &&
          (steps.claude-review.outcome != 'success' ||
           steps.claude-review.outputs.conclusion != 'success')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve-target.outputs.pr-number }}
          STEP_OUTCOME: ${{ steps.claude-review.outcome }}
          MODEL_CONCLUSION: ${{ steps.claude-review.outputs.conclusion }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "Automated review did not complete (step=${STEP_OUTCOME:-unknown}, model=${MODEL_CONCLUSION:-unknown}). No \`Claude review\` status is recorded, so this head is not marked reviewed."

      - name: Confirm the head did not move during the review
        # A review is a statement about a commit. If a commit lands while the review runs, the verdict
        # is about a head that is no longer current, and recording success on it would let a later
        # commit inherit a review it never had. Checked AFTER the review, because that is when the
        # window closes — the pin taken before it proves which commit was read, not that it is still
        # the head.
        id: head-still-current
        if: >-
          steps.workflow-changes.outputs.skip != 'true' &&
          steps.claude-review.outcome == 'success' &&
          steps.claude-review.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve-target.outputs.pr-number }}
          REVIEWED_SHA: ${{ needs.resolve-target.outputs.head-sha }}
        run: |
          set -euo pipefail
          CURRENT=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')
          if [ "$CURRENT" != "$REVIEWED_SHA" ]; then
            echo "::error::Head moved during the review: reviewed ${REVIEWED_SHA}, current ${CURRENT}. Not recording a completed review; request /review again after local review."
            # Say it ON THE PR. Without this the review ran and was discarded, yet the PR shows
            # nothing — identical to "not reviewed yet" — and the only trace is a job log. The
            # remedy is an action a person must take, so it has to reach them, which is the same
            # reason the "did not complete" path comments.
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "Automated review ran against \`${REVIEWED_SHA:0:7}\` but the head has since moved to \`${CURRENT:0:7}\`, so the verdict is stale and was NOT recorded. No \`Claude review\` status exists for this head. Run \`/review\` again once local review passes."
            echo "still-current=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Head unchanged at ${REVIEWED_SHA}"
          echo "still-current=true" >> "$GITHUB_OUTPUT"

      - name: Record the reviewed head
        # A commit status ON THE REVIEWED SHA, so freshness is a fact about a commit rather
        # than a note about a PR. A later commit carries no such status, so a stale verdict
        # cannot be inherited. Repository protection is NOT changed here: this only records.
        #
        # Reached only when the review actually ran: a skipped review writes NO status, so
        # "completed review" is never recorded for a review that did not happen. Failures in
        # the review step skip this too, because a failed action is not a completed review.
        # 'outcome == success' only says the STEP did not crash. The action reports the MODEL's
        # execution status separately, and that is the one that means a review happened: an action
        # that exits 0 after a model error would otherwise record a completed review.
        if: >-
          steps.workflow-changes.outputs.skip != 'true' &&
          steps.head-still-current.outputs.still-current == 'true' &&
          steps.claude-review.outcome == 'success' &&
          steps.claude-review.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ needs.resolve-target.outputs.head-sha }}
          PR_NUMBER: ${{ needs.resolve-target.outputs.pr-number }}
          MODEL_CONCLUSION: ${{ steps.claude-review.outputs.conclusion }}
          MODEL: ${{ steps.resolve-model.outputs.model }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context="Claude review" \
            -f description="Reviewed ${HEAD_SHA:0:7} with ${MODEL}" \
            -f target_url="https://github.com/${REPOSITORY}/pull/${PR_NUMBER}" >/dev/null
          echo "Recorded 'Claude review' success on ${HEAD_SHA} (model=${MODEL})" 
