# Temporary: runs the weekly scan job's new steps on a hosted runner, without publishing
# anything, to check them before they first run on the default branch. Removed again
# before this pull request merges.
name: Security audit carry dry run (temporary)

on:
  push:
    branches: [guru-security-audit-carry]

permissions: {}

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Checkout with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the scanners
        run: .github/scripts/security-audit-install.sh

      - name: Find the upstream release last merged and what differs from it
        id: upstream
        env:
          SCOPE: ${{ runner.temp }}/security-audit-scope.txt
        run: |
          git remote add upstream https://github.com/Automattic/pocket-casts-android.git
          git fetch -q --no-tags upstream '+refs/tags/*:refs/tags/upstream/*'
          base=$(git describe --tags --abbrev=0 --match 'upstream/*' HEAD)
          git -c core.quotePath=false diff --name-only --no-renames --diff-filter=d "$base" HEAD > "$SCOPE"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "$(wc -l < "$SCOPE") files differ from upstream release ${base#upstream/}"

      # The step under test, reading the default branch's analysis instead of this branch's.
      - name: Fetch the code results the last run published
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ runner.temp }}/security-audit-previous.sarif
        run: |
          set -o pipefail
          if ! id=$(gh api \
            "repos/$GITHUB_REPOSITORY/code-scanning/analyses?ref=refs/heads/main&tool_name=Semgrep%20OSS&per_page=100" \
            --jq '[.[] | select(.category == "semgrep")][0].id // empty' 2> "$RUNNER_TEMP/api.err"); then
            if ! grep -q "no analysis found" "$RUNNER_TEMP/api.err"; then
              cat "$RUNNER_TEMP/api.err"
              exit 1
            fi
            id=""
          fi
          if [ -n "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/code-scanning/analyses/$id" \
              -H "Accept: application/sarif+json" > "$PREVIOUS"
          else
            echo '{"version":"2.1.0","runs":[]}' > "$PREVIOUS"
          fi
          echo "$(jq '[.runs[].results[]?] | length' "$PREVIOUS") code results in the last published analysis"

      - name: Audit what Auris changed
        env:
          AUDIT_OUT: ${{ runner.temp }}/security-audit
          AUDIT_SCANNERS: code
          AUDIT_QUIET: "true"
          AUDIT_CODE_TARGETS: ${{ runner.temp }}/security-audit-scope.txt
          AUDIT_PREVIOUS_SARIF: ${{ runner.temp }}/security-audit-previous.sarif
        run: .github/scripts/security-audit.sh full

      # Counts only: this log is public.
      - name: Count what would be published
        env:
          AUDIT_OUT: ${{ runner.temp }}/security-audit
          PREVIOUS: ${{ runner.temp }}/security-audit-previous.sarif
        run: |
          cd "$AUDIT_OUT"
          echo "previous results: $(jq '[.runs[].results[]?] | length' "$PREVIOUS")"
          echo "kept from the previous results: $(jq '[.runs[].results[]] | length' kept.sarif)"
          echo "results to publish: $(jq '[.runs[].results[]] | length' semgrep.sarif)"
          echo "previous results in an unfinished file: $(jq --rawfile gaps unscanned.tsv '
            [ $gaps | split("\n")[] | select(. != "") | split("\t")[0] ] as $files
            | [ .runs[].results[]? | select(.locations[0].physicalLocation.artifactLocation.uri as $p | any($files[]; . == $p)) ] | length' "$PREVIOUS")"
          jq -c '
            ([(.runs[].results // [])[].ruleId] | unique) as $used
            | .runs[].tool.driver.rules |= ((. // []) | map(select(.id as $id | $used | index($id))))
          ' semgrep.sarif | jq -c '{rules: (.runs[0].tool.driver.rules | length), results: (.runs[0].results | length)}'
