name: "Auris Android release"

# On main, run the same checks the PR workflows run, and once they are green,
# trigger the Android release pipeline on the Buildkite agent (the signed-AAB
# build and the Play internal-track upload). Until BUILDKITE_API_TOKEN exists
# as a secret, the trigger step is skipped: the tests still run, the release
# does not. The release pipeline itself also stops at the signed AAB until its
# store secrets exist, so this workflow never ships anything unexpected. The
# trigger job only runs on refs/heads/main: a workflow_dispatch on any other
# ref runs the checks but never labels a commit as main for Buildkite. The
# upload itself needs PLAY_UPLOAD=1 on the pipeline (off by default; the
# switch is turned on only after Google approves the upload-key reset).

on:
  push:
    branches: [main]
  workflow_dispatch:
    # workflow_dispatch can select any ref; the release trigger below must only
    # ever fire for commits actually on main.

jobs:
  trigger-script-controls:
    name: "Trigger script controls"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash .buildkite/scripts/trigger-release.test.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: bash .buildkite/scripts/keystore-decode.test.sh
      - run: bash .buildkite/scripts/r2-publish.test.sh
      - run: bash .buildkite/scripts/verify-play-apk.test.sh
      - run: ruby .buildkite/scripts/release-gates.test.rb


  play-api-surface:
    name: "Play API surface (real gem)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Checks the fetcher's Play API names against the real gem classes, so a
      # renamed method or changed property fails here rather than at the first
      # upload. Install JUST that gem at the locked version -- a full
      # `bundle install` pulls fastlane and takes minutes, and this control needs
      # one gem, not the release toolchain.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      # Install the version Gemfile.lock pins, read from the lock itself: a
      # hardcoded literal here would drift on a lockfile bump and certify a gem
      # nobody ships. The control also asserts loaded == pinned.
      - name: "Install the locked Play API gem"
        run: |
          PIN="$(sed -n 's/^    google-apis-androidpublisher_v3 (\([0-9.]*\))/\1/p' Gemfile.lock | head -1)"
          [ -n "$PIN" ] || { echo "FAIL: no google-apis-androidpublisher_v3 pin in Gemfile.lock" >&2; exit 1; }
          echo "Installing pinned version $PIN"
          gem install google-apis-androidpublisher_v3 -v "$PIN" --no-document
      - run: ruby .buildkite/scripts/fetch-play-apk-api.test.rb

  voice-unit-tests:
    name: "voice:testDebugUnitTest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # This job runs the same suite as voice-unit-tests.yml and needs the same jar. It gates
      # the release trigger, so a Maven outage here holds releases back even when the other
      # workflow is green -- which is what happened before this step existed. Keep the two
      # cache steps identical; robolectric-cache.test.sh asserts both carry one.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-${{ hashFiles('gradle/libs.versions.toml', 'modules/services/voice/src/test/resources/robolectric.properties') }}
      - run: ./gradlew :modules:services:voice:testDebugUnitTest --no-daemon

  cloud-transport-tests:
    name: "repositories:cloud transport tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :modules:services:repositories:testDebugUnitTest --tests "*CloudTurnRouteTest*" --tests "*WebSocketCloudTurnTransport*" --no-daemon

  android-test-compile:
    name: "androidTest compiles"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:compileDebugAndroidTestKotlin --no-daemon

  trigger-release:
    name: "Trigger the release build"
    # EVERY job that runs a release control belongs here. A control outside this
    # list reds the PR check list while the pipeline still uploads to Play;
    # release-gates.test.rb asserts this pairing so a new one cannot be forgotten.
    needs: [trigger-script-controls, play-api-surface, voice-unit-tests, cloud-transport-tests, android-test-compile]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
      BUILDKITE_ORG: ${{ vars.BUILDKITE_ORG }}
      BUILDKITE_PIPELINE: ${{ vars.BUILDKITE_PIPELINE_ANDROID }}
    steps:
      - uses: actions/checkout@v7
      - name: "Trigger the auris-android Buildkite pipeline"
        if: ${{ env.BUILDKITE_API_TOKEN != '' }}
        run: bash .buildkite/scripts/trigger-release.sh
      - name: "No API token yet"
        if: ${{ env.BUILDKITE_API_TOKEN == '' }}
        run: echo "BUILDKITE_API_TOKEN not set — release not triggered (dry-run mode)"
