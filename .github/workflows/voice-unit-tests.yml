name: "Voice and cloud transport unit tests"

# The voice module's Robolectric suite (47+ cases covering ASR engine, cloud route sink,
# intent routing, spoken template resolution, and diagnostics) and the repositories
# module's cloud transport tests (encoded frame serialization, WebSocket transport)
# had no CI job running them. Wired for every PR and for pushes to main only
# a branch push no longer double-runs the suite that its
# pull_request event already covers, and main stays guarded after merge.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  voice-unit-tests:
    name: "voice:testDebugUnitTest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Robolectric resolves android-all into ~/.m2/repository (its MavenDependencyResolver's
      # default), so that is the directory to cache. Keyed on the inputs that decide WHICH jar is
      # needed, so a Robolectric or SDK bump cannot leave a stale key re-fetching every run.
      # restore/save rather than actions/cache: the combined action saves only when the job
      # succeeds, which is exactly when the jar is least likely to have been downloaded.
      - name: Restore the Robolectric android-all jar
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-${{ hashFiles('gradle/libs.versions.toml', 'modules/services/voice/src/test/resources/robolectric.properties') }}
      # Seed explicitly rather than relying on the suite to download it. When Gradle serves the test
      # task from its build cache Robolectric never runs, so nothing lands in ~/.m2 and the save step
      # would report success while storing nothing. Seeding must not depend on the tests running.
      - name: Seed the Robolectric android-all jar
        run: bash .github/scripts/robolectric-seed.sh
      - name: Run voice module Robolectric unit tests (self-contained)
        shell: bash
        run: set -o pipefail; ./gradlew :modules:services:voice:testDebugUnitTest --no-daemon --info 2>&1 | tee voice-test-output.log
      # Evidence that the cached directory is the one Robolectric READS, from the runner itself
      # rather than from a local assumption. --info logs each android-all artifact resolution.
      - name: Report the resolved android-all path
        if: always()
        shell: bash
        run: |
          echo "--- android-all files present under the cached directory ---"
          find "$HOME/.m2/repository/org/robolectric" -name 'android-all*.jar' 2>/dev/null || true
          echo "--- resolver lines from the test log ---"
          grep -iE "android-all|robolectric.*\.m2" voice-test-output.log | head -20 || true
      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-test-reports
          path: |
            modules/services/voice/build/reports/tests/testDebugUnitTest/
            modules/services/voice/build/test-results/testDebugUnitTest/
            voice-test-output.log

      # Save whatever the seed produced, even when the tests fail: a Maven outage that reds the suite
      # must still leave the jar cached for the next run. Gated on the file being present so a failed
      # seed cannot store an empty directory under the good key.
      - name: Save the Robolectric android-all jar
        if: always() && hashFiles('~/.m2/repository/org/robolectric/**/*.jar') != ''
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-${{ hashFiles('gradle/libs.versions.toml', 'modules/services/voice/src/test/resources/robolectric.properties') }}

  cloud-transport-tests:
    name: "repositories:cloud transport tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # No Robolectric cache or prefetch here: these are plain-JUnit tests that never load an
      # android-all jar. Prefetching one would only add a way for this job to fail on a Maven
      # outage that previously left it green.
      - name: Run cloud transport and encoding tests
        run: ./gradlew :modules:services:repositories:testDebugUnitTest --tests "*CloudTurnRouteTest*" --tests "*WebSocketCloudTurnTransport*" --no-daemon
