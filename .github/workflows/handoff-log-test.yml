# TEMPORARY, removed before merge. Proves on a hosted runner that the hand-off the weekly
# security audit uses keeps a report out of the public job logs. It moves a harmless report
# between two jobs with the same commands as security-audit.yml.
name: Hand-off log test

on:
  pull_request:
    paths:
      - .github/workflows/handoff-log-test.yml

permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      bundle: ${{ steps.results.outputs.bundle }}
    steps:
      - name: Hand a harmless report to the next job
        id: results
        env:
          HANDOFF_KEY: ${{ secrets.SECURITY_AUDIT_HANDOFF_KEY }}
        run: |
          set -o pipefail
          if [ -z "$HANDOFF_KEY" ]; then
            echo "::error::The repository secret SECURITY_AUDIT_HANDOFF_KEY must be configured."
            exit 1
          fi
          mkdir handoff
          # Derived, so that the text to look for in the logs is not in this file.
          marker="benign-$(printf '%s' "$GITHUB_RUN_ID" | sha256sum | cut -c1-24)"
          printf '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"test","rules":[]}},"results":[{"ruleId":"%s"}]}]}\n' "$marker" > handoff/semgrep.sarif
          printf 'src/%s.kt\t*\n' "$marker" > handoff/unscanned.tsv
          bundle=$(tar -C handoff -cf - . | gzip -9 \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:HANDOFF_KEY | base64 -w 0)
          echo "bundle: ${#bundle} characters"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

  receive:
    needs: send
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Unpack the results
        env:
          BUNDLE: ${{ needs.send.outputs.bundle }}
          HANDOFF_KEY: ${{ secrets.SECURITY_AUDIT_HANDOFF_KEY }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/security-audit"
          printf '%s' "$BUNDLE" | base64 -d \
            | openssl enc -d -aes-256-cbc -pbkdf2 -pass env:HANDOFF_KEY | gunzip \
            | tar -C "$RUNNER_TEMP/security-audit" -xf -
          marker="benign-$(printf '%s' "$GITHUB_RUN_ID" | sha256sum | cut -c1-24)"
          grep -q "$marker" "$RUNNER_TEMP/security-audit/semgrep.sarif"
          grep -q "$marker" "$RUNNER_TEMP/security-audit/unscanned.tsv"
          echo "The report arrived intact."
