name: "Release script controls"

# The trigger and keystore-decode controls must gate PRs too: a PR that breaks
# them should fail before merge, not only on the next main push.

on:
  pull_request:
    paths:
      - ".buildkite/scripts/**"
      - ".buildkite/commands/**"
      - ".github/workflows/release-script-controls.yml"
      - ".github/workflows/auris-release.yml"

jobs:
  controls:
    name: "Trigger + keystore controls"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash .buildkite/scripts/trigger-release.test.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: bash .buildkite/scripts/keystore-decode.test.sh
      - run: bash .buildkite/scripts/r2-publish.test.sh
      - run: bash .buildkite/scripts/verify-play-apk.test.sh
      - run: ruby .buildkite/scripts/release-gates.test.rb

  play-api-surface:
    name: "Play API surface (real gem)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The fetcher's Play API names were only ever read statically: the gem was
      # not installed where the review ran. Install JUST that gem at the locked
      # version -- a full `bundle install` pulls fastlane and takes minutes, and
      # this control needs one gem, not the release toolchain.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: gem install google-apis-androidpublisher_v3 -v 0.106.0 --no-document
      - run: ruby .buildkite/scripts/fetch-play-apk-api.test.rb
