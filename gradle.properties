## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Mon Mar 30 10:47:43 AEDT 2020
android.useAndroidX=true

# Disable unused Android Gradle Plugin features
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

org.gradle.daemon=true
# Metaspace is separate from -Xmx and is what retires a daemon mid-build when it is exhausted, so
# both are set. Note that a jvmargs key in ~/.gradle/gradle.properties is loaded AFTER this file and
# therefore WINS over it: that applies to BOTH org.gradle.jvmargs below and kotlin.daemon.jvmargs
# further down. Keep that file free of both keys or these values are silently ignored.
org.gradle.jvmargs=-Xmx10g -XX:MaxMetaspaceSize=2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:ReservedCodeCacheSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Verified: this key (not a -Dkotlin.daemon.jvmargs inside org.gradle.jvmargs) is what the Kotlin
# daemon starts with — the running daemon reports these args. Metaspace is capped generously (the
# same 2g as the Gradle daemon) because a clean all-module build is where it peaks, and an exhausted
# Metaspace retires the daemon mid-compile.
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g
org.gradle.workers.max=8

# Dependency Analysis Plugin
dependency.analysis.android.ignored.variants=release,prototype,debugProd

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
