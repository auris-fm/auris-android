name: "Voice and cloud transport unit tests"

# The voice module's Robolectric suite (47+ cases covering ASR engine, cloud route sink,
# intent routing, spoken template resolution, and diagnostics) and the repositories
# module's cloud transport tests (encoded frame serialization, WebSocket transport)
# had no CI job running them. Wired for every PR and for pushes to main only
# a branch push no longer double-runs the suite that its
# pull_request event already covers, and main stays guarded after merge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  voice-unit-tests:
    name: "voice:testDebugUnitTest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-v1
      - name: Prefetch Robolectric android-all (retried, so Maven Central blips cannot fail tests)
        shell: bash
        run: |
          # The android-all jar Robolectric ${ROBOLECTRIC_VERSION} needs at class-load time.
          # Keyed above on a manual -v1 so a deliberate bump updates this list in the same PR.
          ARTIFACT="android-all-instrumented-15-robolectric-13954326-i7"
          VERSION="15-robolectric-13954326-i7"
          DIR="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$VERSION"
          mkdir -p "$DIR"
          BASE="https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/$VERSION"
          for SUFFIX in jar pom jar.sha512 pom.sha512; do
            curl --fail --retry 5 --retry-all-errors --retry-delay 3 -sS -o "$DIR/$ARTIFACT.$SUFFIX" "$BASE/$ARTIFACT.$SUFFIX"
          done
      - name: Run voice module Robolectric unit tests (self-contained)
        shell: bash
        run: set -o pipefail; ./gradlew :modules:services:voice:testDebugUnitTest --no-daemon --info 2>&1 | tee voice-test-output.log
      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-test-reports
          path: |
            modules/services/voice/build/reports/tests/testDebugUnitTest/
            modules/services/voice/build/test-results/testDebugUnitTest/
            voice-test-output.log

  cloud-transport-tests:
    name: "repositories:cloud transport tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-v1
      - name: Prefetch Robolectric android-all (retried, so Maven Central blips cannot fail tests)
        shell: bash
        run: |
          # The android-all jar Robolectric ${ROBOLECTRIC_VERSION} needs at class-load time.
          # Keyed above on a manual -v1 so a deliberate bump updates this list in the same PR.
          ARTIFACT="android-all-instrumented-15-robolectric-13954326-i7"
          VERSION="15-robolectric-13954326-i7"
          DIR="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$VERSION"
          mkdir -p "$DIR"
          BASE="https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/$VERSION"
          for SUFFIX in jar pom jar.sha512 pom.sha512; do
            curl --fail --retry 5 --retry-all-errors --retry-delay 3 -sS -o "$DIR/$ARTIFACT.$SUFFIX" "$BASE/$ARTIFACT.$SUFFIX"
          done
      - name: Run cloud transport and encoding tests
        run: ./gradlew :modules:services:repositories:testDebugUnitTest --tests "*CloudTurnRouteTest*" --tests "*WebSocketCloudTurnTransport*" --no-daemon
