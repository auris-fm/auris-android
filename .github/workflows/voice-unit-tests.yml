name: "Voice and cloud transport unit tests"

# The voice module's Robolectric suite (47+ cases covering ASR engine, cloud route sink,
# intent routing, spoken template resolution, and diagnostics) and the repositories
# module's cloud transport tests (encoded frame serialization, WebSocket transport)
# had no CI job running them. Wired for every PR and for pushes to main only
# (owner 23d4b138/f087c34d): a branch push no longer double-runs the suite that its
# pull_request event already covers, and main stays guarded after merge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  voice-unit-tests:
    name: "voice:testDebugUnitTest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout pinned core (parity authority)
        uses: actions/checkout@v7
        with:
          repository: auris-fm/core
          ref: 3dd0c91d095512e3c49108c25b726a3b66a66eef
          token: ${{ secrets.CORE_PINNED_READ_TOKEN }}
          path: core-pinned
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assert pinned core SHA
        shell: bash
        run: |
          actual="$(git -C core-pinned rev-parse HEAD)"
          if [ "$actual" != "3dd0c91d095512e3c49108c25b726a3b66a66eef" ]; then
            echo "pinned core checkout mismatch: $actual" >&2
            exit 1
          fi
      - name: Provision pinned worker (npm ci)
        shell: bash
        run: |
          cd core-pinned/worker
          npm ci
      - name: Run voice module Robolectric unit tests
        shell: bash
        env:
          AURIS_CLOUD_WORKER_ROOT: ${{ github.workspace }}/core-pinned/worker
        run: set -o pipefail; ./gradlew :modules:services:voice:testDebugUnitTest --no-daemon --info 2>&1 | tee voice-test-output.log
      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-test-reports
          path: |
            modules/services/voice/build/reports/tests/testDebugUnitTest/
            modules/services/voice/build/test-results/testDebugUnitTest/
            voice-test-output.log

  cloud-transport-tests:
    name: "repositories:cloud transport tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run cloud transport and encoding tests
        run: ./gradlew :modules:services:repositories:testDebugUnitTest --tests "*CloudTurnRouteTest*" --tests "*WebSocketCloudTurnTransport*" --no-daemon
