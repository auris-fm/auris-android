# Robolectric's bundled android-all caps at API 36 while the app's targetSdkVersion is 37, so the
# default SDK resolution fails before any test runs. Pin the unit-test SDK explicitly; raise this
# when the pinned Robolectric version ships a newer android-all.
sdk=35
# Class-level @Config(sdk = [35]) on existing tests still wins over this file; those classes are
# unaffected.
